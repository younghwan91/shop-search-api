<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" fill="none">
  <defs>
    <linearGradient id="tm-banner-bg-l" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#FFF7ED"/>
    </linearGradient>
    <linearGradient id="tm-mark-bg-l" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <linearGradient id="tm-accent-l" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="tm-lens-l" x1="850" y1="60" x2="990" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="tm-glow-l" cx="940" cy="140" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="20" fill="url(#tm-banner-bg-l)" stroke="#E4E4E7" stroke-width="1.5"/>
  <circle cx="940" cy="140" r="140" fill="url(#tm-glow-l)"/>

  <!-- Brand Mark -->
  <g transform="translate(56, 44)">
    <rect width="64" height="64" rx="14" fill="url(#tm-mark-bg-l)"/>
    <rect x="1" y="1" width="62" height="62" rx="13" stroke="#FB923C" stroke-opacity="0.32" stroke-width="1.5"/>
    <circle cx="29" cy="29" r="14" stroke="url(#tm-accent-l)" stroke-width="3.25"/>
    <path d="M39.5 39.5L49 49" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
    <path d="M30.5 20.5L24.5 29.5H29.5L27.5 37.5L33.5 28.5H28.5L30.5 20.5Z" fill="#FBBF24"/>
  </g>

  <!-- Title & Tagline -->
  <text x="56" y="152" fill="#18181B" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.025em">thirtymall-search-api</text>
  <text x="56" y="186" fill="#52525B" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500">Cached Fastify search API, brand filters &amp; Discord alerts for thirtymall.com</text>

  <!-- Tech Pill -->
  <rect x="56" y="210" width="412" height="28" rx="14" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1"/>
  <text x="72" y="228.5" fill="#3F3F46" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.06em">NODE.JS >=22 · TYPESCRIPT 5.9 · FASTIFY 5 · WEBHOOK</text>

  <!-- Search Lens + Lightning Artwork -->
  <g transform="translate(760, 36)">
    <!-- Subtle filter/API bars -->
    <rect x="0" y="34" width="128" height="12" rx="6" fill="#FED7AA" fill-opacity="0.7"/>
    <rect x="16" y="64" width="96" height="12" rx="6" fill="#FDE68A" fill-opacity="0.8"/>
    <rect x="0" y="94" width="112" height="12" rx="6" fill="#E4E4E7" fill-opacity="0.8"/>
    <rect x="24" y="124" width="84" height="12" rx="6" fill="#FED7AA" fill-opacity="0.55"/>

    <!-- Search Lens -->
    <circle cx="195" cy="94" r="64" fill="#FFFFFF" fill-opacity="0.85" stroke="url(#tm-lens-l)" stroke-width="8"/>
    <circle cx="195" cy="94" r="48" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 5"/>
    <!-- Search Handle -->
    <path d="M 242 141 L 288 187" stroke="#EA580C" stroke-width="12" stroke-linecap="round"/>
    <!-- Lightning Bolt inside Lens -->
    <path d="M 203 54 L 171 99 H 197 L 187 134 L 219 89 H 193 L 203 54 Z" fill="url(#tm-lens-l)"/>
  </g>
</svg>
